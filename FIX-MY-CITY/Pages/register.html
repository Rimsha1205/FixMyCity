<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - FixMyCity</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar">
        <h2>FixMyCity</h2>

        <div>
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>
    <div class="form-container">

        <h2>Create an Account</h2>

        <p class="form-description">
            Register to report and track civic complaints.
        </p>

        <form id="registerForm">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

            <label for="mobile">Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                class="form-control"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <label>Select Your Role</label>

            <div class="role-options">

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="Citizen"
                        required
                    >
                    Citizen
                </label>

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="Municipal Officer"
                    >
                    Municipal Officer
                </label>

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="Department Staff"
                    >
                    Department Staff
                </label>

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="Administrator"
                    >
                    Administrator
                </label>

            </div>

            <br>

             <div id="departmentField" style="display: none;">
                <label for="department">Select Department</label>
                <select
                    id="department"
                    class="form-select"
                    disabled
                >
                    <option value="">-- Select Department --</option>
                </select>
                <small id="departmentHelp" class="text-muted">
                    Select a department from the available list.
                </small>
            </div>

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Re-enter your password"
                required
            >

            <button
                type="submit"
                class="btn btn-primary form-btn"
            >
                Register
            </button>

        </form>

        <p class="form-footer">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <p id="registerMessage" class="message"></p>

    </div>

    <script src="../js/auth.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
