
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints - FixMyCity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <h2>FixMyCity</h2>

        <div class="nav-links">
            <a href="citizen-dashboard.html">Dashboard</a>
            <a href="add-complaint.html">Register Complaint</a>
            <a href="track-complaint.html">Track Complaint</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>

    </nav>


    <!-- My Complaints Section -->
    <main class="my-complaints-container">

        <div class="complaints-heading">
            <h2>My Complaints</h2>

            <p>
                View and check the status of your registered complaints.
            </p>
        </div>


        <!-- Complaint Filters -->
        <div class="complaint-filters">

            <div>
                <label for="statusFilter">Filter by Status</label>

                <select id="statusFilter" class="form-select">

                    <option value="all">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Submitted">Submitted</option>
                    <option value="Assigned">Assigned</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Rejected">Rejected</option>

                </select>
            </div>


            <div>
                <label for="categoryFilter">Filter by Category</label>

                <select id="categoryFilter" class="form-select">

                    <option value="all">All Categories</option>
                    <option value="Garbage Collection">Garbage Collection</option>
                    <option value="Road Damage">Road Damage</option>
                    <option value="Streetlight Issue">Streetlight Issue</option>
                    <option value="Water Leakage">Water Leakage</option>
                    <option value="Drainage Problem">Drainage Problem</option>
                    <option value="Public Toilet Issue">Public Toilet Issue</option>
                    <option value="Other">Other</option>

                </select>
            </div>

        </div>


        <!-- Complaint Cards Generated by JavaScript -->
        <div id="complaintList" class="complaint-list"></div>

    </main>


    <!-- JavaScript Files -->
    <script src="../JS/mock-data.js"></script>
    <script src="../JS/my-complaints.js"></script>

</body>
</html>
