
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FixMyCity</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>FixMyCity</h2>

        <div>
            <a href="../index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>


    <!-- Login Section -->
    <div class="login-container">

        <div class="login-box">

            <div class="login-heading">
                <h1>Welcome Back!</h1>
                <p>Login to your FixMyCity account</p>
            </div>


            <form id="loginForm">

                <!-- Role Selection -->
                <label>Select Your Role</label>

                <div class="login-role-options">

                    <label class="login-role-card">
                        <input
                            type="radio"
                            name="loginRole"
                            value="Citizen"
                            required
                        >
                        <span class="role-icon">👤</span>
                        <span class="role-name">Citizen</span>
                    </label>

                    <label class="login-role-card">
                        <input
                            type="radio"
                            name="loginRole"
                            value="Municipal Officer"
                        >
                        <span class="role-icon">🏛️</span>
                        <span class="role-name">Municipal Officer</span>
                    </label>

                    <label class="login-role-card">
                        <input
                            type="radio"
                            name="loginRole"
                            value="Department Staff"
                        >
                        <span class="role-icon">👷</span>
                        <span class="role-name">Department Staff</span>
                    </label>

                    <label class="login-role-card">
                        <input
                            type="radio"
                            name="loginRole"
                            value="Administrator"
                        >
                        <span class="role-icon">🛡️</span>
                        <span class="role-name">Administrator</span>
                    </label>

                </div>


                <!-- Email Address -->
                <label for="loginEmail">Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Enter your registered email"
                    required
                >


                <!-- Password -->
                <label for="loginPassword">Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Message -->
                <p id="loginMessage"></p>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Registration Link -->
            <p class="register-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="../js/auth.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
